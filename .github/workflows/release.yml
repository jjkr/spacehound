name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Staging release version (X.Y.Z)"
        required: true
        type: string
      channel:
        description: "Update channel"
        required: true
        default: staging
        type: choice
        options:
          - staging

permissions:
  contents: write
  id-token: write

# Version ordering is checked while holding this per-channel workflow lock.
# This prevents an older build from publishing mutable aliases after a newer one.
concurrency:
  group: spacerabbit-release-${{ github.event_name == 'push' && 'production' || 'staging' }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    environment: production
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', inputs.version) }}
      RELEASE_CHANNEL: ${{ github.event_name == 'push' && 'production' || inputs.channel }}
      RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', inputs.version) }}
      SPARKLE_FEED_URL: ${{ github.event_name == 'push' && 'https://updates.spacerabbit.io/appcast.xml' || 'https://updates.spacerabbit.io/staging/appcast.xml' }}
      SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
      AWS_REGION: ${{ vars.AWS_RELEASE_REGION }}
      AWS_RELEASE_BUCKET: ${{ vars.AWS_RELEASE_BUCKET }}
      AWS_CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
      AWS_RELEASE_ROLE_ARN: ${{ vars.AWS_RELEASE_ROLE_ARN }}
      DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
      CODE_SIGN_IDENTITY: Developer ID Application
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      BUILD_KEYCHAIN_PASSWORD: ${{ secrets.BUILD_KEYCHAIN_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.DEVELOPMENT_TEAM }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate release configuration
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          required_vars=(
            AWS_CLOUDFRONT_DISTRIBUTION_ID
            AWS_REGION
            AWS_RELEASE_BUCKET
            AWS_RELEASE_ROLE_ARN
            BUILD_CERTIFICATE_BASE64
            P12_PASSWORD
            BUILD_KEYCHAIN_PASSWORD
            DEVELOPMENT_TEAM
            APPLE_ID
            APPLE_APP_SPECIFIC_PASSWORD
            SPARKLE_ED_PRIVATE_KEY
            SPARKLE_PUBLIC_ED_KEY
          )

          for name in "${required_vars[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required secret or variable: ${name}"
              exit 1
            fi
          done

          version="${RELEASE_TAG#v}"
          ./scripts/validate-release-version.sh "${version}" >/dev/null
          ./scripts/tests/release-scripts-test.sh

          if [[ ! -d spacerabbit-core ]]; then
            echo "::error::Expected spacerabbit-core/ sources in this repository."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_RELEASE_ROLE_ARN }}

      - name: Check published version ordering
        run: |
          set -euo pipefail
          mkdir -p build
          if [[ "${RELEASE_CHANNEL}" == "production" ]]; then
            appcast_key="appcast.xml"
          else
            appcast_key="staging/appcast.xml"
          fi

          key_count=$(aws s3api list-objects-v2 \
            --bucket "${AWS_RELEASE_BUCKET}" \
            --prefix "${appcast_key}" \
            --max-keys 1 \
            --query KeyCount \
            --output text)

          if [[ "${key_count}" == "1" ]]; then
            aws s3 cp "s3://${AWS_RELEASE_BUCKET}/${appcast_key}" build/current-appcast.xml
            ./scripts/validate-release-version.sh "${RELEASE_TAG#v}" build/current-appcast.xml >/dev/null
          elif [[ "${key_count}" != "0" ]]; then
            echo "::error::Unexpected appcast object count: ${key_count}"
            exit 1
          fi

      - name: Install build tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          set -euo pipefail
          for tool in xcodegen cmake ninja; do
            if command -v "${tool}" >/dev/null 2>&1; then
              echo "${tool} already present: $(command -v "${tool}")"
            else
              echo "Installing missing tool: ${tool}"
              brew install "${tool}"
            fi
          done

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_PATH: ${{ runner.temp }}/build_certificate.p12
          KEYCHAIN_PATH: ${{ runner.temp }}/app-signing.keychain-db
        run: |
          set -euo pipefail
          echo -n "${BUILD_CERTIFICATE_BASE64}" | base64 --decode -o "${CERTIFICATE_PATH}"
          security create-keychain -p "${BUILD_KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${BUILD_KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERTIFICATE_PATH}" -P "${P12_PASSWORD}" -A -f pkcs12 -k "${KEYCHAIN_PATH}"
          security set-key-partition-list -S apple-tool:,apple: -k "${BUILD_KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}" login.keychain-db
          security default-keychain -d user -s "${KEYCHAIN_PATH}"

      - name: Build signed release artifacts
        run: ./scripts/package-release.sh

      - name: Generate release notes
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          notes_path="build/dist/SpaceRabbit-${version}-arm64.md"

          if [[ "${RELEASE_CHANNEL}" == "production" ]]; then
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="${RELEASE_TAG}" \
              --jq .body > "${notes_path}"
          else
            printf '# SpaceRabbit %s staging update\n\nInternal validation build.\n' "${version}" > "${notes_path}"
          fi

      - name: Generate and verify signed appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          sparkle_bin="build/DerivedDataRelease/SourcePackages/artifacts/sparkle/Sparkle/bin"

          if [[ "${RELEASE_CHANNEL}" == "production" ]]; then
            release_prefix="releases/v${version}"
          else
            release_prefix="staging/releases/v${version}"
          fi

          export UPDATE_ARCHIVE_PATH="build/dist/SpaceRabbit-${version}-arm64.zip"
          export RELEASE_NOTES_PATH="build/dist/SpaceRabbit-${version}-arm64.md"
          export APPCAST_OUTPUT_PATH="build/dist/appcast.xml"
          export DOWNLOAD_URL_PREFIX="https://updates.spacerabbit.io/${release_prefix}"
          export RELEASE_NOTES_URL_PREFIX="https://updates.spacerabbit.io/${release_prefix}"
          export SPARKLE_GENERATE_APPCAST="${sparkle_bin}/generate_appcast"
          export SPARKLE_SIGN_UPDATE="${sparkle_bin}/sign_update"
          ./scripts/generate-appcast.sh

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: SpaceRabbit-${{ env.RELEASE_TAG }}-${{ env.RELEASE_CHANNEL }}
          path: build/dist/*

      - name: Publish immutable AWS artifacts
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          if [[ "${RELEASE_CHANNEL}" == "production" ]]; then
            release_prefix="releases/v${version}"
          else
            release_prefix="staging/releases/v${version}"
          fi

          zip_name="SpaceRabbit-${version}-arm64.zip"
          dmg_name="SpaceRabbit-${version}-arm64.dmg"
          notes_name="SpaceRabbit-${version}-arm64.md"
          checksums_name="SpaceRabbit-${version}-SHA256SUMS.txt"

          if aws s3api head-object \
            --bucket "${AWS_RELEASE_BUCKET}" \
            --key "${release_prefix}/${zip_name}" >/dev/null 2>&1; then
            echo "::error::Release ${release_prefix} already exists and will not be overwritten"
            exit 1
          fi

          aws s3 cp "build/dist/${zip_name}" "s3://${AWS_RELEASE_BUCKET}/${release_prefix}/${zip_name}" \
            --cache-control 'public,max-age=31536000,immutable' \
            --content-type application/zip
          aws s3 cp "build/dist/${dmg_name}" "s3://${AWS_RELEASE_BUCKET}/${release_prefix}/${dmg_name}" \
            --cache-control 'public,max-age=31536000,immutable' \
            --content-type application/x-apple-diskimage
          aws s3 cp "build/dist/${notes_name}" "s3://${AWS_RELEASE_BUCKET}/${release_prefix}/${notes_name}" \
            --cache-control 'public,max-age=31536000,immutable' \
            --content-type 'text/markdown; charset=utf-8'
          aws s3 cp "build/dist/${checksums_name}" "s3://${AWS_RELEASE_BUCKET}/${release_prefix}/${checksums_name}" \
            --cache-control 'public,max-age=31536000,immutable' \
            --content-type 'text/plain; charset=utf-8'

      - name: Publish GitHub release mirror
        if: env.RELEASE_CHANNEL == 'production'
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          notes_path="build/dist/SpaceRabbit-${version}-arm64.md"

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "::error::GitHub release ${RELEASE_TAG} already exists and will not be overwritten"
            exit 1
          fi

          gh release create "${RELEASE_TAG}" \
            "build/dist/SpaceRabbit-${version}-arm64.zip" \
            "build/dist/SpaceRabbit-${version}-arm64.dmg" \
            "build/dist/SpaceRabbit-${version}-SHA256SUMS.txt" \
            "${notes_path}" \
            "build/dist/appcast.xml" \
            --title "${RELEASE_TAG}" \
            --notes-file "${notes_path}"

      - name: Update latest aliases
        if: env.RELEASE_CHANNEL == 'production'
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          aws s3 cp "build/dist/SpaceRabbit-${version}-arm64.zip" \
            "s3://${AWS_RELEASE_BUCKET}/releases/latest/SpaceRabbit-arm64.zip" \
            --cache-control 'no-cache,max-age=0' \
            --content-type application/zip
          aws s3 cp "build/dist/SpaceRabbit-${version}-arm64.dmg" \
            "s3://${AWS_RELEASE_BUCKET}/releases/latest/SpaceRabbit-arm64.dmg" \
            --cache-control 'no-cache,max-age=0' \
            --content-type application/x-apple-diskimage
          aws s3 cp "build/dist/SpaceRabbit-${version}-SHA256SUMS.txt" \
            "s3://${AWS_RELEASE_BUCKET}/releases/latest/SpaceRabbit-SHA256SUMS.txt" \
            --cache-control 'no-cache,max-age=0' \
            --content-type 'text/plain; charset=utf-8'

      - name: Publish signed appcast last
        run: |
          set -euo pipefail
          if [[ "${RELEASE_CHANNEL}" == "production" ]]; then
            appcast_key="appcast.xml"
            invalidation_paths=(
              '/appcast.xml'
              '/releases/latest/*'
            )
          else
            appcast_key="staging/appcast.xml"
            invalidation_paths=(
              '/staging/appcast.xml'
            )
          fi

          aws s3 cp build/dist/appcast.xml "s3://${AWS_RELEASE_BUCKET}/${appcast_key}" \
            --cache-control 'no-cache,max-age=0' \
            --content-type 'application/xml; charset=utf-8'
          aws cloudfront create-invalidation \
            --distribution-id "${AWS_CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "${invalidation_paths[@]}"

      - name: Clean up keychain
        if: always()
        env:
          KEYCHAIN_PATH: ${{ runner.temp }}/app-signing.keychain-db
        run: security delete-keychain "${KEYCHAIN_PATH}" || true
