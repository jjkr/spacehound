name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      RELEASE_VERSION: ${{ github.ref_name }}
      DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
      CODE_SIGN_IDENTITY: Developer ID Application
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      BUILD_KEYCHAIN_PASSWORD: ${{ secrets.BUILD_KEYCHAIN_PASSWORD }}
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          ssh-key: ${{ secrets.SUBMODULE_SSH_KEY }}

      - name: Validate release configuration
        run: |
          set -euo pipefail

          required_vars=(
            BUILD_CERTIFICATE_BASE64
            P12_PASSWORD
            BUILD_KEYCHAIN_PASSWORD
            DEVELOPMENT_TEAM
            APPLE_API_KEY_BASE64
            APPLE_API_KEY_ID
          )

          for name in "${required_vars[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required secret or variable: ${name}"
              exit 1
            fi
          done

          if [[ ! -d spacerabbit-core ]]; then
            echo "::error::Expected spacerabbit-core/ submodule checkout in this repository."
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen cmake ninja

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_PATH: ${{ runner.temp }}/build_certificate.p12
          KEYCHAIN_PATH: ${{ runner.temp }}/app-signing.keychain-db
        run: |
          set -euo pipefail

          echo -n "${BUILD_CERTIFICATE_BASE64}" | base64 --decode -o "${CERTIFICATE_PATH}"

          security create-keychain -p "${BUILD_KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${BUILD_KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERTIFICATE_PATH}" -P "${P12_PASSWORD}" -A -f pkcs12 -k "${KEYCHAIN_PATH}"
          security set-key-partition-list -S apple-tool:,apple: -k "${BUILD_KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}" login.keychain-db
          security default-keychain -d user -s "${KEYCHAIN_PATH}"

      - name: Write App Store Connect API key
        run: |
          set -euo pipefail

          APPLE_API_KEY_PATH="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo -n "${APPLE_API_KEY_BASE64}" | base64 --decode -o "${APPLE_API_KEY_PATH}"
          chmod 600 "${APPLE_API_KEY_PATH}"
          echo "APPLE_API_KEY_PATH=${APPLE_API_KEY_PATH}" >> "${GITHUB_ENV}"

      - name: Build signed release artifacts
        run: ./scripts/package-release.sh

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: SpaceRabbit-${{ github.ref_name || 'manual' }}-release
          path: build/dist/*

      - name: Publish GitHub release assets
        if: github.event_name == 'push'
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          assets=(build/dist/*)

          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${assets[@]}" --clobber
          else
            gh release create "${tag}" "${assets[@]}" --title "${tag}" --generate-notes
          fi

      - name: Clean up keychain
        if: always()
        env:
          KEYCHAIN_PATH: ${{ runner.temp }}/app-signing.keychain-db
        run: security delete-keychain "${KEYCHAIN_PATH}" || true
