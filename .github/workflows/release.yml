name: Release

# Pushing a vX.Y.Z tag builds, signs, and notarizes the app once, publishes it
# as a GitHub pre-release, and adds it to the beta channel of the Sparkle feed.
# After testing, promote it with `gh release edit vX.Y.Z --prerelease=false
# --latest`, which runs the Promote workflow.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

# Releases and promotions both rewrite the single published feed, so they
# never run at the same time.
concurrency:
  group: spacehound-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish beta
    runs-on: macos-26
    timeout-minutes: 90
    environment: release
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      SPARKLE_FEED_URL: https://updates.spacehound.app/appcast.xml
      SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
      SENTRY_DSN: ${{ vars.SENTRY_DSN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
      CODE_SIGN_IDENTITY: Developer ID Application
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      BUILD_KEYCHAIN_PASSWORD: ${{ secrets.BUILD_KEYCHAIN_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.DEVELOPMENT_TEAM }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release configuration
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail

          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Release tags must point at a commit on main"
            exit 1
          fi

          required_vars=(
            BUILD_CERTIFICATE_BASE64
            P12_PASSWORD
            BUILD_KEYCHAIN_PASSWORD
            DEVELOPMENT_TEAM
            APPLE_ID
            APPLE_APP_SPECIFIC_PASSWORD
            SPARKLE_ED_PRIVATE_KEY
            SPARKLE_PUBLIC_ED_KEY
            SENTRY_AUTH_TOKEN
            SENTRY_DSN
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID
          )
          for name in "${required_vars[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing release environment secret or variable: ${name}"
              exit 1
            fi
          done

          release_version=$(./scripts/validate-release-version.sh "${RELEASE_TAG}")
          echo "RELEASE_VERSION=${release_version}" >> "${GITHUB_ENV}"
          echo "DOWNLOAD_URL_PREFIX=https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/" >> "${GITHUB_ENV}"

          ./scripts/prepare-release-notes.sh \
            "${release_version}" \
            "release-notes/v${release_version}.md" \
            "${RUNNER_TEMP}/release-notes-validation.md" >/dev/null
          ./scripts/tests/release-scripts-test.sh
          [[ -d spacehound-core ]] || {
            echo "::error::Expected spacehound-core/ sources in this repository."
            exit 1
          }

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "::error::A GitHub release for ${RELEASE_TAG} already exists"
            exit 1
          fi

      - name: Fetch published appcast and check version ordering
        env:
          # Only the first release may start a new feed.
          ALLOW_MISSING_FEED: "1"
        run: |
          set -euo pipefail
          ./scripts/fetch-live-appcast.sh "${SPARKLE_FEED_URL}" updates/public/appcast.xml
          if [[ -s updates/public/appcast.xml ]]; then
            ./scripts/validate-release-version.sh "${RELEASE_VERSION}" updates/public/appcast.xml >/dev/null
          fi

      - name: Install build tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          set -euo pipefail
          for tool in xcodegen cmake ninja sentry-cli; do
            if ! command -v "${tool}" >/dev/null 2>&1; then
              brew install "${tool}"
            fi
          done

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_PATH: ${{ runner.temp }}/build_certificate.p12
          KEYCHAIN_PATH: ${{ runner.temp }}/app-signing.keychain-db
        run: |
          set -euo pipefail
          echo -n "${BUILD_CERTIFICATE_BASE64}" | base64 --decode -o "${CERTIFICATE_PATH}"
          security create-keychain -p "${BUILD_KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${BUILD_KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERTIFICATE_PATH}" -P "${P12_PASSWORD}" -A -f pkcs12 -k "${KEYCHAIN_PATH}"
          security set-key-partition-list -S apple-tool:,apple: -k "${BUILD_KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}" login.keychain-db
          security default-keychain -d user -s "${KEYCHAIN_PATH}"

      - name: Build, sign, and notarize
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: ./scripts/package-release.sh

      - name: Prepare release notes
        run: |
          set -euo pipefail
          ./scripts/prepare-release-notes.sh \
            "${RELEASE_VERSION}" \
            "release-notes/v${RELEASE_VERSION}.md" \
            "build/dist/SpaceHound-${RELEASE_VERSION}-arm64.md"

      - name: Add release to the beta channel of the appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          sparkle_bin=$(./scripts/resolve-sparkle-tools.sh)
          export SPARKLE_GENERATE_APPCAST="${sparkle_bin}/generate_appcast"
          export SPARKLE_SIGN_UPDATE="${sparkle_bin}/sign_update"
          export RELEASE_CHANNEL=beta
          export UPDATE_ARCHIVE_PATH="build/dist/SpaceHound-${RELEASE_VERSION}-arm64.zip"
          export RELEASE_NOTES_PATH="build/dist/SpaceHound-${RELEASE_VERSION}-arm64.md"
          export APPCAST_PATH=updates/public/appcast.xml
          ./scripts/generate-appcast.sh

      - name: Create GitHub pre-release
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" \
            --verify-tag \
            --prerelease \
            --title "SpaceHound ${RELEASE_VERSION}" \
            --notes-file "build/dist/SpaceHound-${RELEASE_VERSION}-arm64.md" \
            "build/dist/SpaceHound-${RELEASE_VERSION}-arm64.zip" \
            "build/dist/SpaceHound-${RELEASE_VERSION}-arm64.dmg" \
            "build/dist/SpaceHound-${RELEASE_VERSION}-SHA256SUMS.txt"

          # Sparkle downloads from this URL; make sure GitHub serves it before
          # the feed advertises it.
          curl --fail --silent --show-error --location --head --output /dev/null \
            "${DOWNLOAD_URL_PREFIX}SpaceHound-${RELEASE_VERSION}-arm64.zip"

      - name: Publish appcast
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pinned to the same version as `make updates-deploy` so CI and
          # manual deploys behave identically.
          wranglerVersion: "4.135.0"
          workingDirectory: updates
          command: deploy

      - name: Keep a copy of the published appcast
        uses: actions/upload-artifact@v7
        with:
          name: appcast-${{ env.RELEASE_TAG }}-beta
          path: updates/public/appcast.xml
          if-no-files-found: error
          retention-days: 30

      - name: Clean up keychain
        if: always()
        env:
          KEYCHAIN_PATH: ${{ runner.temp }}/app-signing.keychain-db
        run: security delete-keychain "${KEYCHAIN_PATH}" || true

      - name: Record promotion instructions
        if: success()
        run: |
          {
            echo "### Beta ${RELEASE_VERSION} published"
            echo
            echo "Enable **Receive beta updates** in SpaceHound's Settings and check for updates."
            echo "When it is ready for everyone, promote it with:"
            echo
            echo '```sh'
            echo "gh release edit ${RELEASE_TAG} --repo ${GITHUB_REPOSITORY} --prerelease=false --latest"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
