name: SpaceRabbit

options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    CURRENT_PROJECT_VERSION: 0.1.0fc1
    MARKETING_VERSION: 0.1.0
    CLANG_ENABLE_OBJC_ARC: YES
    SPARKLE_FEED_URL: https://updates.getspacerabbit.com/appcast.xml
    SPARKLE_BETA_FEED_URL: https://beta-updates.getspacerabbit.com/appcast.xml
    SPARKLE_PUBLIC_ED_KEY: ""

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.2

targets:
  SpaceRabbit:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: SpaceRabbitApp/Sources
      - path: spacerabbit-core/lib/control.cpp
      - path: spacerabbit-core/lib/daemon.cpp
      - path: spacerabbit-core/lib/display_switch.cpp
      - path: spacerabbit-core/lib/ns.mm
        compilerFlags:
          - -fno-objc-arc
      - path: spacerabbit-core/lib/settings.cpp
      - path: spacerabbit-core/lib/version.cpp
      - path: SpaceRabbitApp/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: SpaceRabbit
        PRODUCT_BUNDLE_IDENTIFIER: com.animaslabs.SpaceRabbit
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CLANG_CXX_LANGUAGE_STANDARD: c++23
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - /System/Library/PrivateFrameworks
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/spacerabbit-core/include
          - $(SRCROOT)/spacerabbit-core/lib
          - $(SRCROOT)/third_party
          - $(DERIVED_FILE_DIR)/spacerabbit-generated/include
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework ApplicationServices
          - -framework Carbon
          - -framework SkyLight
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: Sparkle
    preBuildScripts:
      - name: Generate spacerabbit version header
        outputFiles:
          - $(DERIVED_FILE_DIR)/spacerabbit-generated/include/spacerabbit/version.hpp
        script: |
          set -euo pipefail

          generated_dir="${DERIVED_FILE_DIR}/spacerabbit-generated/include/spacerabbit"
          generated_header_path="${generated_dir}/version.hpp"
          marketing_version="${MARKETING_VERSION:-0.1.0}"

          major=0
          minor=0
          patch=0
          IFS='.' read -r major minor patch <<< "${marketing_version}"
          major="${major:-0}"
          minor="${minor:-0}"
          patch="${patch:-0}"

          release_build_literal=false
          if [[ "${CONFIGURATION}" == "Release" ]]; then
            release_build_literal=true
          fi

          mkdir -p "${generated_dir}"
          cat > "${generated_header_path}" <<EOF
          #pragma once

          #include <cstdint>
          #include <string_view>

          #include <spacerabbit/export.hpp>

          namespace spacerabbit {

          inline constexpr std::uint32_t version_major = ${major};
          inline constexpr std::uint32_t version_minor = ${minor};
          inline constexpr std::uint32_t version_patch = ${patch};
          inline constexpr std::string_view version = "${marketing_version}";
          inline constexpr std::string_view version_build_metadata = "";
          inline constexpr std::string_view version_full = "${marketing_version}";
          inline constexpr bool is_release_build = ${release_build_literal};

          SPACERABBIT_EXPORT auto version_string() noexcept -> std::string_view;
          SPACERABBIT_EXPORT auto version_full_string() noexcept -> std::string_view;

          }  // namespace spacerabbit
          EOF
    info:
      path: SpaceRabbitApp/Info.plist
      properties:
        CFBundleDisplayName: SpaceRabbit
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticTermination: true
        NSSupportsSuddenTermination: true
        SUAllowsAutomaticUpdates: true
        SUAutomaticallyUpdate: false
        SUBetaFeedURL: $(SPARKLE_BETA_FEED_URL)
        SUEnableAutomaticChecks: true
        SUFeedURL: $(SPARKLE_FEED_URL)
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        SURequireSignedFeed: true
        SUVerifyUpdateBeforeExtraction: true

schemes:
  SpaceRabbit:
    build:
      targets:
        SpaceRabbit: all
    run:
      config: Debug
    archive:
      config: Release
    profile:
      config: Release
    analyze:
      config: Debug
