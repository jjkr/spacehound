name: SpaceRabbit

options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    CLANG_ENABLE_OBJC_ARC: YES

targets:
  SpaceRabbit:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: SpaceRabbitApp/Sources
      - path: SpaceRabbitApp/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: SpaceRabbit
        PRODUCT_BUNDLE_IDENTIFIER: com.animaslabs.SpaceRabbit
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES
    preBuildScripts:
      - name: Copy spacerabbitd
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/spacerabbitd
        script: |
          set -euo pipefail

          resolver_args=()
          if [[ "${BUILD_SPACERABBIT_CORE_IF_NEEDED:-0}" == "1" ]]; then
            resolver_args+=(--build-if-needed)
          fi

          daemon_path="$("${PROJECT_DIR}/scripts/resolve-daemon.sh" "${resolver_args[@]}")"

          if [[ -z "${daemon_path}" ]]; then
            echo "error: spacerabbitd binary not found. Set SPACERABBITD_PATH or make spacerabbit-core available." >&2
            exit 1
          fi

          destination_dir="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers"
          destination_path="${destination_dir}/spacerabbitd"
          mkdir -p "${destination_dir}"
          cp "${daemon_path}" "${destination_path}"
          chmod 755 "${destination_path}"

          if [[ "${CODE_SIGNING_ALLOWED:-NO}" == "YES" ]]; then
            if [[ -z "${EXPANDED_CODE_SIGN_IDENTITY:-}" || "${EXPANDED_CODE_SIGN_IDENTITY}" == "-" ]]; then
              echo "error: unable to sign spacerabbitd because no expanded code signing identity is available." >&2
              exit 1
            fi

            codesign_args=(
              --force
              --sign "${EXPANDED_CODE_SIGN_IDENTITY}"
              --identifier "${PRODUCT_BUNDLE_IDENTIFIER}.daemon"
            )

            if [[ "${ENABLE_HARDENED_RUNTIME:-NO}" == "YES" ]]; then
              codesign_args+=(
                --options runtime
                --timestamp
              )
            fi

            codesign "${codesign_args[@]}" "${destination_path}"
          fi
    info:
      path: SpaceRabbitApp/Info.plist
      properties:
        CFBundleDisplayName: SpaceRabbit
        LSUIElement: true
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticTermination: true
        NSSupportsSuddenTermination: true

schemes:
  SpaceRabbit:
    build:
      targets:
        SpaceRabbit: all
    run:
      config: Debug
    archive:
      config: Release
    profile:
      config: Release
    analyze:
      config: Debug
