name: SpaceHound

options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    CURRENT_PROJECT_VERSION: 0.4.1
    MARKETING_VERSION: 0.4.1
    CLANG_ENABLE_OBJC_ARC: YES
    SPARKLE_FEED_URL: https://updates.spacehound.app/appcast.xml
    SPARKLE_PUBLIC_ED_KEY: ""
    SENTRY_DSN: ""

packages:
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    exactVersion: 9.29.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0

targets:
  SpaceHound:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: SpaceHoundApp/Sources
      - path: spacehound-core/lib/control.cpp
      - path: spacehound-core/lib/daemon.cpp
      - path: spacehound-core/lib/display_switch.cpp
      - path: spacehound-core/lib/ns.mm
        compilerFlags:
          - -fno-objc-arc
      - path: spacehound-core/lib/settings.cpp
      - path: spacehound-core/lib/version.cpp
      - path: SpaceHoundApp/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: SpaceHound
        PRODUCT_BUNDLE_IDENTIFIER: com.jjkr.spacehound
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CLANG_CXX_LANGUAGE_STANDARD: c++23
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - /System/Library/PrivateFrameworks
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/spacehound-core/include
          - $(SRCROOT)/spacehound-core/lib
          - $(SRCROOT)/third_party
          - $(DERIVED_FILE_DIR)/spacehound-generated/include
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework ApplicationServices
          - -framework Carbon
          - -framework ServiceManagement
          - -framework SkyLight
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: Sentry
      - package: Sparkle
    preBuildScripts:
      - name: Generate spacehound version header
        outputFiles:
          - $(DERIVED_FILE_DIR)/spacehound-generated/include/spacehound/version.hpp
        script: |
          set -euo pipefail

          generated_dir="${DERIVED_FILE_DIR}/spacehound-generated/include/spacehound"
          generated_header_path="${generated_dir}/version.hpp"
          marketing_version="${MARKETING_VERSION:-0.4.1}"

          major=0
          minor=0
          patch=0
          IFS='.' read -r major minor patch <<< "${marketing_version}"
          major="${major:-0}"
          minor="${minor:-0}"
          patch="${patch:-0}"

          release_build_literal=false
          if [[ "${CONFIGURATION}" == "Release" ]]; then
            release_build_literal=true
          fi

          mkdir -p "${generated_dir}"
          cat > "${generated_header_path}" <<EOF
          #pragma once

          #include <cstdint>
          #include <string_view>

          namespace spacehound {

          inline constexpr std::uint32_t version_major = ${major};
          inline constexpr std::uint32_t version_minor = ${minor};
          inline constexpr std::uint32_t version_patch = ${patch};
          inline constexpr std::string_view version = "${marketing_version}";
          inline constexpr std::string_view version_build_metadata = "";
          inline constexpr std::string_view version_full = "${marketing_version}";
          inline constexpr bool is_release_build = ${release_build_literal};

          auto version_string() noexcept -> std::string_view;
          auto version_full_string() noexcept -> std::string_view;

          }  // namespace spacehound
          EOF
    info:
      path: SpaceHoundApp/Info.plist
      properties:
        CFBundleDisplayName: SpaceHound
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticTermination: true
        NSSupportsSuddenTermination: true
        SUAllowsAutomaticUpdates: true
        SUAutomaticallyUpdate: false
        SUEnableAutomaticChecks: true
        SUFeedURL: $(SPARKLE_FEED_URL)
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        SURequireSignedFeed: true
        SUVerifyUpdateBeforeExtraction: true
        SentryDSN: $(SENTRY_DSN)

schemes:
  SpaceHound:
    build:
      targets:
        SpaceHound: all
    run:
      config: Debug
    archive:
      config: Release
    profile:
      config: Release
    analyze:
      config: Debug
